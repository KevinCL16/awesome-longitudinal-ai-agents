name: Add survey landing page link

on:
  push:
    paths:
      - '.github/workflows/add-landing-page-link.yml'

permissions:
  contents: write

jobs:
  update-readme:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Add companion page link near top of README
        run: |
          python - <<'PY'
          from pathlib import Path
          p = Path('README.md')
          text = p.read_text(encoding='utf-8')
          link = '[Survey companion page](https://kevincl16.github.io/organizing-intelligence-over-time.html)'
          if link in text:
              raise SystemExit(0)
          marker = 'This list maps research on that longitudinal dimension: persistent experience, experiential learning, reusable workflows and skills, continual and self-evolving agents, adaptive cognitive control, repeated Human–AI adaptation, and evaluation over histories of interaction.\n\n'
          insert = marker + '**Companion:** [Organizing Intelligence Over Time — survey landing page](https://kevincl16.github.io/organizing-intelligence-over-time.html)\n\n'
          if marker not in text:
              raise SystemExit('README insertion marker not found')
          p.write_text(text.replace(marker, insert, 1), encoding='utf-8')
          PY
      - name: Commit README update
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add README.md
          git diff --cached --quiet && exit 0
          git commit -m "docs: link survey landing page"
          git push
