name: Add Procedural Graphs entry

on:
  push:
    paths:
      - '.github/workflows/add-procedural-graphs.yml'

permissions:
  contents: write

jobs:
  update-readme:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Add paper to literature map
        run: |
          python - <<'PY'
          from pathlib import Path
          p = Path('README.md')
          text = p.read_text()
          marker = '- [Agent Workflow Memory](https://proceedings.mlr.press/v267/wang25bx.html) — Wang et al., ICML 2025. Retrieves reusable workflow knowledge from earlier successful executions.\n'
          entry = '- [Procedural Graphs: Self-Evolving Execution Structures for LLM Agents](https://arxiv.org/abs/2609.09153) — Lu et al., arXiv 2026. Encodes procedural knowledge as an editable execution graph that is refined from successful and failed trajectories under held-out validation.\n'
          if entry not in text:
              if marker not in text:
                  raise SystemExit('Insertion marker not found')
              text = text.replace(marker, marker + entry, 1)
              p.write_text(text)
          PY
      - name: Commit README update
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add README.md
          git diff --cached --quiet && exit 0
          git commit -m "docs: add Procedural Graphs"
          git push
