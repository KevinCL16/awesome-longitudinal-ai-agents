name: Add loop map to README

on:
  push:
    paths:
      - '.github/workflows/add-loop-map.yml'

permissions:
  contents: write

jobs:
  patch-readme:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Insert figure
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path

          path = Path('README.md')
          text = path.read_text()
          anchor = '**Companion:** [Organizing Intelligence Over Time — survey landing page](https://kevincl16.github.io/organizing-intelligence-over-time.html) · [PDF](https://kevincl16.github.io/Organizing_Intelligence_Over_Time_v1_2026-09-12.pdf)'
          figure = '''<p align="center">
            <img src="assets/joint-cognitive-development-loop-map.svg" alt="Mapping Awesome Longitudinal AI Agents sections to the joint cognitive development loop" width="100%">
          </p>'''
          if figure not in text:
              text = text.replace(anchor, anchor + '\n\n' + figure)
              path.write_text(text)
          PY
      - name: Commit README
        shell: bash
        run: |
          if git diff --quiet -- README.md; then
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add README.md
          git commit -m "Show loop mapping figure in README"
          git push
